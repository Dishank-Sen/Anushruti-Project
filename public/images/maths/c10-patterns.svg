<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg10)"/>

  <!-- Repeating Pattern Line: Circle, Square, Triangle, Circle, Square, Triangle -->
  <g filter="url(#shadow10)" transform="translate(30, 75)">
    <!-- 1: Circle -->
    <circle cx="25" cy="25" r="22" fill="#EF4444"/>
    <!-- 2: Square -->
    <rect x="75" y="5" width="40" height="40" rx="8" fill="#3B82F6"/>
    <!-- 3: Triangle -->
    <polygon points="170,5 145,45 195,45" fill="#10B981"/>

    <!-- 4: Circle -->
    <circle cx="235" cy="25" r="22" fill="#EF4444"/>
    <!-- 5: Square -->
    <rect x="285" y="5" width="40" height="40" rx="8" fill="#3B82F6"/>
    <!-- 6: Question / Next Triangle -->
    <polygon points="365,5 340,45 390,45" fill="#10B981" opacity="0.4" stroke="#10B981" stroke-dasharray="4,4" stroke-width="2"/>
    <text x="365" y="32" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="20" fill="#047857" text-anchor="middle">?</text>
  </g>

  <text x="200" y="160" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#B45309" text-anchor="middle">What comes next? (पैटर्न पहचानें)</text>
</svg>
