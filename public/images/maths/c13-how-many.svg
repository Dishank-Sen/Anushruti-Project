<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="shadow13" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg13)"/>

  <!-- Magnifying Glass observing items -->
  <g filter="url(#shadow13)" transform="translate(60, 45)">
    <!-- 4 Little Ladybugs -->
    <circle cx="20" cy="30" r="14" fill="#E11D48"/>
    <circle cx="16" cy="27" r="2" fill="#000000"/><circle cx="24" cy="27" r="2" fill="#000000"/>
    <circle cx="20" cy="35" r="2" fill="#000000"/>

    <circle cx="60" cy="40" r="14" fill="#E11D48"/>
    <circle cx="56" cy="37" r="2" fill="#000000"/><circle cx="64" cy="37" r="2" fill="#000000"/>
    <circle cx="60" cy="45" r="2" fill="#000000"/>

    <circle cx="35" cy="80" r="14" fill="#E11D48"/>
    <circle cx="31" cy="77" r="2" fill="#000000"/><circle cx="39" cy="77" r="2" fill="#000000"/>
    <circle cx="35" cy="85" r="2" fill="#000000"/>

    <circle cx="75" cy="85" r="14" fill="#E11D48"/>
    <circle cx="71" cy="82" r="2" fill="#000000"/><circle cx="79" cy="82" r="2" fill="#000000"/>
    <circle cx="75" cy="90" r="2" fill="#000000"/>
  </g>

  <!-- Big Magnifying Glass Right -->
  <g filter="url(#shadow13)" transform="translate(200, 30)">
    <circle cx="50" cy="50" r="44" fill="#FFFFFF" fill-opacity="0.6" stroke="#9D174D" stroke-width="8"/>
    <line x1="82" y1="82" x2="135" y2="135" stroke="#9D174D" stroke-width="12" stroke-linecap="round"/>
    <!-- Count inside glass -->
    <text x="50" y="58" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#BE185D" text-anchor="middle">4?</text>
  </g>

  <text x="200" y="165" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#9D174D" text-anchor="middle">Count and write: How many? (कितने?)</text>
</svg>
