<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg4)"/>

  <!-- Fruit Basket with 5 Apples -->
  <g filter="url(#shadow4)" transform="translate(60, 75)">
    <!-- Basket Bowl -->
    <path d="M 20 50 Q 60 90 100 50 L 90 30 L 30 30 Z" fill="#D97706"/>
    <!-- 3 Apples Inside -->
    <circle cx="45" cy="25" r="14" fill="#EF4444"/>
    <circle cx="65" cy="22" r="14" fill="#EF4444"/>
    <circle cx="85" cy="26" r="14" fill="#EF4444"/>
  </g>

  <!-- Big Minus Sign -->
  <g filter="url(#shadow4)" transform="translate(200, 95)">
    <rect x="0" y="0" width="40" height="12" rx="6" fill="#EA580C"/>
  </g>

  <!-- 2 Apples rolling away with motion lines -->
  <g filter="url(#shadow4)" transform="translate(270, 75)">
    <path d="M -15 30 Q -5 20 10 30" stroke="#FDBA74" stroke-width="2.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="30" cy="30" r="14" fill="#F87171"/>
    <path d="M 45 45 Q 55 35 70 45" stroke="#FDBA74" stroke-width="2.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="85" cy="45" r="14" fill="#F87171"/>
  </g>

  <text x="200" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="24" fill="#9A3412" text-anchor="middle">5 - 2 = 3</text>
</svg>
