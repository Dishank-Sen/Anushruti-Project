<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg2)"/>
  <path d="M0 170 Q 200 140 400 170 L 400 200 L 0 200 Z" fill="#7DD3FC" opacity="0.4"/>

  <!-- Balloons with numbers 1, 2, 3, 4, 5 -->
  <!-- Balloon 1: Red -->
  <g filter="url(#shadow2)" transform="translate(45, 30)">
    <path d="M 25 70 Q 25 100 28 115" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="40" rx="25" ry="32" fill="#F43F5E"/>
    <polygon points="25,72 20,78 30,78" fill="#F43F5E"/>
    <text x="25" y="48" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- Balloon 2: Amber -->
  <g filter="url(#shadow2)" transform="translate(110, 20)">
    <path d="M 25 70 Q 28 95 24 125" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="40" rx="25" ry="32" fill="#F59E0B"/>
    <polygon points="25,72 20,78 30,78" fill="#F59E0B"/>
    <text x="25" y="48" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <!-- Balloon 3: Emerald -->
  <g filter="url(#shadow2)" transform="translate(175, 35)">
    <path d="M 25 70 Q 22 95 26 110" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="40" rx="25" ry="32" fill="#10B981"/>
    <polygon points="25,72 20,78 30,78" fill="#10B981"/>
    <text x="25" y="48" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- Balloon 4: Violet -->
  <g filter="url(#shadow2)" transform="translate(240, 18)">
    <path d="M 25 70 Q 27 95 23 127" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="40" rx="25" ry="32" fill="#8B5CF6"/>
    <polygon points="25,72 20,78 30,78" fill="#8B5CF6"/>
    <text x="25" y="48" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">4</text>
  </g>

  <!-- Balloon 5: Sky Blue -->
  <g filter="url(#shadow2)" transform="translate(305, 32)">
    <path d="M 25 70 Q 23 95 26 113" stroke="#94A3B8" stroke-width="2" fill="none"/>
    <ellipse cx="25" cy="40" rx="25" ry="32" fill="#0EA5E9"/>
    <polygon points="25,72 20,78 30,78" fill="#0EA5E9"/>
    <text x="25" y="48" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">5</text>
  </g>
</svg>
