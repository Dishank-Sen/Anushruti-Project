<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg7)"/>

  <!-- Balance Scale in Center -->
  <g filter="url(#shadow7)" transform="translate(130, 45)">
    <!-- Base Triangle & Pole -->
    <polygon points="70,110 50,135 90,135" fill="#991B1B"/>
    <line x1="70" y1="35" x2="70" y2="110" stroke="#991B1B" stroke-width="6"/>
    <circle cx="70" cy="35" r="7" fill="#DC2626"/>

    <!-- Tilted Beam (Left heavier, right lighter) -->
    <line x1="5" y1="50" x2="135" y2="20" stroke="#B91C1C" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Pan (Heavy Pumpkin) -->
    <line x1="15" y1="50" x2="15" y2="85" stroke="#78716C" stroke-width="2"/>
    <path d="M -5 85 Q 15 105 35 85 Z" fill="#D97706"/>
    <circle cx="15" cy="78" r="14" fill="#EA580C"/>

    <!-- Right Pan (Light Feather) -->
    <line x1="125" y1="20" x2="125" y2="55" stroke="#78716C" stroke-width="2"/>
    <path d="M 105 55 Q 125 75 145 55 Z" fill="#D97706"/>
    <ellipse cx="125" cy="48" rx="10" ry="4" fill="#38BDF8" transform="rotate(-20 125 48)"/>
  </g>

  <!-- Labels -->
  <text x="75" y="165" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#991B1B" text-anchor="middle">Heavy (भारी)</text>
  <text x="325" y="165" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#0369A1" text-anchor="middle">Light (हल्का)</text>
</svg>
