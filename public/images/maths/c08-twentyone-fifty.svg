<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg8)"/>

  <!-- 3 Garlands of 10 beads each (representing 30) -->
  <g filter="url(#shadow8)" transform="translate(45, 55)">
    <!-- Garland 1 -->
    <circle cx="10" cy="20" r="7" fill="#C026D3"/>
    <circle cx="24" cy="20" r="7" fill="#D946EF"/>
    <circle cx="38" cy="20" r="7" fill="#C026D3"/>
    <circle cx="52" cy="20" r="7" fill="#D946EF"/>
    <circle cx="66" cy="20" r="7" fill="#C026D3"/>
    <circle cx="80" cy="20" r="7" fill="#D946EF"/>
    <circle cx="94" cy="20" r="7" fill="#C026D3"/>
    <circle cx="108" cy="20" r="7" fill="#D946EF"/>
    <text x="60" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#86198F" text-anchor="middle">10 beads</text>
  </g>

  <g filter="url(#shadow8)" transform="translate(185, 55)">
    <!-- Garland 2 -->
    <circle cx="10" cy="20" r="7" fill="#C026D3"/>
    <circle cx="24" cy="20" r="7" fill="#D946EF"/>
    <circle cx="38" cy="20" r="7" fill="#C026D3"/>
    <circle cx="52" cy="20" r="7" fill="#D946EF"/>
    <circle cx="66" cy="20" r="7" fill="#C026D3"/>
    <circle cx="80" cy="20" r="7" fill="#D946EF"/>
    <circle cx="94" cy="20" r="7" fill="#C026D3"/>
    <circle cx="108" cy="20" r="7" fill="#D946EF"/>
    <text x="60" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#86198F" text-anchor="middle">10 beads</text>
  </g>

  <!-- 3 Loose beads -->
  <g filter="url(#shadow8)" transform="translate(320, 65)">
    <circle cx="15" cy="15" r="9" fill="#E879F9"/>
    <circle cx="35" cy="15" r="9" fill="#E879F9"/>
    <circle cx="55" cy="15" r="9" fill="#E879F9"/>
    <text x="35" y="42" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#86198F" text-anchor="middle">3 ones</text>
  </g>

  <text x="200" y="160" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="22" fill="#701A75" text-anchor="middle">20 + 3 = 23</text>
</svg>
