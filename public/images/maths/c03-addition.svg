<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg3)"/>
  
  <!-- Pond ripples -->
  <ellipse cx="200" cy="165" rx="180" ry="25" fill="#A7F3D0" opacity="0.6"/>

  <!-- Lilypad Left with 2 Frogs -->
  <ellipse cx="100" cy="140" rx="65" ry="22" fill="#34D399"/>
  <!-- Left Group: 2 dots/frogs -->
  <circle cx="80" cy="115" r="18" fill="#10B981" filter="url(#shadow3)"/>
  <circle cx="75" cy="110" r="3" fill="#FFFFFF"/><circle cx="85" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="75" cy="110" r="1.5" fill="#064E3B"/><circle cx="85" cy="110" r="1.5" fill="#064E3B"/>
  
  <circle cx="120" cy="118" r="18" fill="#10B981" filter="url(#shadow3)"/>
  <circle cx="115" cy="113" r="3" fill="#FFFFFF"/><circle cx="125" cy="113" r="3" fill="#FFFFFF"/>
  <circle cx="115" cy="113" r="1.5" fill="#064E3B"/><circle cx="125" cy="113" r="1.5" fill="#064E3B"/>

  <!-- Large Big Plus Sign in Middle -->
  <g filter="url(#shadow3)" transform="translate(180, 70)">
    <rect x="15" y="0" width="12" height="42" rx="6" fill="#059669"/>
    <rect x="0" y="15" width="42" height="12" rx="6" fill="#059669"/>
  </g>

  <!-- Lilypad Right with 1 Frog -->
  <ellipse cx="300" cy="140" rx="55" ry="20" fill="#34D399"/>
  <circle cx="300" cy="115" r="18" fill="#10B981" filter="url(#shadow3)"/>
  <circle cx="295" cy="110" r="3" fill="#FFFFFF"/><circle cx="305" cy="110" r="3" fill="#FFFFFF"/>
  <circle cx="295" cy="110" r="1.5" fill="#064E3B"/><circle cx="305" cy="110" r="1.5" fill="#064E3B"/>

  <text x="200" y="50" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="24" fill="#065F46" text-anchor="middle">2 + 1 = 3</text>
</svg>
