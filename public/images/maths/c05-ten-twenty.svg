<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg5)"/>

  <!-- Bundle of 10 tied with ribbon -->
  <g filter="url(#shadow5)" transform="translate(70, 45)">
    <!-- 10 sticks/pencils -->
    <rect x="0" y="0" width="12" height="90" rx="4" fill="#6366F1"/>
    <rect x="10" y="0" width="12" height="90" rx="4" fill="#818CF8"/>
    <rect x="20" y="0" width="12" height="90" rx="4" fill="#4F46E5"/>
    <rect x="30" y="0" width="12" height="90" rx="4" fill="#6366F1"/>
    <rect x="40" y="0" width="12" height="90" rx="4" fill="#818CF8"/>
    <rect x="50" y="0" width="12" height="90" rx="4" fill="#4F46E5"/>
    <rect x="60" y="0" width="12" height="90" rx="4" fill="#6366F1"/>
    <rect x="70" y="0" width="12" height="90" rx="4" fill="#818CF8"/>
    <!-- Red Ribbon -->
    <rect x="-5" y="38" width="95" height="14" rx="4" fill="#EF4444"/>
    <circle cx="42" cy="45" r="12" fill="#DC2626"/>
    <text x="42" y="50" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">10</text>
  </g>

  <!-- Plus -->
  <text x="210" y="105" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="32" fill="#4338CA" text-anchor="middle">+</text>

  <!-- 4 Loose ones -->
  <g filter="url(#shadow5)" transform="translate(255, 45)">
    <rect x="0" y="0" width="12" height="90" rx="4" fill="#A5B4FC"/>
    <rect x="20" y="0" width="12" height="90" rx="4" fill="#A5B4FC"/>
    <rect x="40" y="0" width="12" height="90" rx="4" fill="#A5B4FC"/>
    <rect x="60" y="0" width="12" height="90" rx="4" fill="#A5B4FC"/>
  </g>

  <text x="200" y="170" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="20" fill="#312E81" text-anchor="middle">1 Ten + 4 Ones = 14</text>
</svg>
