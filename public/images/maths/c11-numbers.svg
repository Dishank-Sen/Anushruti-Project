<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg11)"/>

  <!-- Train Track -->
  <line x1="20" y1="150" x2="380" y2="150" stroke="#64748B" stroke-width="4"/>
  <line x1="40" y1="145" x2="40" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="80" y1="145" x2="80" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="120" y1="145" x2="120" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="160" y1="145" x2="160" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="200" y1="145" x2="200" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="240" y1="145" x2="240" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="280" y1="145" x2="280" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="320" y1="145" x2="320" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="360" y1="145" x2="360" y2="155" stroke="#475569" stroke-width="3"/>

  <!-- Train Engine -->
  <g filter="url(#shadow11)" transform="translate(45, 65)">
    <rect x="0" y="20" width="70" height="55" rx="8" fill="#2563EB"/>
    <rect x="50" y="5" width="20" height="25" rx="4" fill="#1D4ED8"/>
    <circle cx="18" cy="75" r="10" fill="#1E293B"/>
    <circle cx="52" cy="75" r="10" fill="#1E293B"/>
    <text x="35" y="55" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">50</text>
  </g>

  <!-- Coach 1 (60) -->
  <g filter="url(#shadow11)" transform="translate(135, 75)">
    <rect x="0" y="10" width="65" height="55" rx="8" fill="#0284C7"/>
    <circle cx="15" cy="65" r="10" fill="#1E293B"/>
    <circle cx="50" cy="65" r="10" fill="#1E293B"/>
    <text x="32" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">60</text>
  </g>

  <!-- Coach 2 (70) -->
  <g filter="url(#shadow11)" transform="translate(220, 75)">
    <rect x="0" y="10" width="65" height="55" rx="8" fill="#0D9488"/>
    <circle cx="15" cy="65" r="10" fill="#1E293B"/>
    <circle cx="50" cy="65" r="10" fill="#1E293B"/>
    <text x="32" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">70</text>
  </g>

  <!-- Coach 3 (80) -->
  <g filter="url(#shadow11)" transform="translate(305, 75)">
    <rect x="0" y="10" width="65" height="55" rx="8" fill="#059669"/>
    <circle cx="15" cy="65" r="10" fill="#1E293B"/>
    <circle cx="50" cy="65" r="10" fill="#1E293B"/>
    <text x="32" y="45" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">80</text>
  </g>
</svg>
