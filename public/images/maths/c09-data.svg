<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="16" fill="url(#bg9)"/>

  <!-- Bar / Pictograph Chart -->
  <!-- Column 1: Apples (4) -->
  <g filter="url(#shadow9)" transform="translate(80, 45)">
    <rect x="0" y="20" width="45" height="100" rx="8" fill="#EF4444"/>
    <text x="22" y="15" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#DC2626" text-anchor="middle">4</text>
    <text x="22" y="135" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#1F2937" text-anchor="middle">🍎</text>
  </g>

  <!-- Column 2: Stars (6) -->
  <g filter="url(#shadow9)" transform="translate(175, 25)">
    <rect x="0" y="20" width="45" height="120" rx="8" fill="#F59E0B"/>
    <text x="22" y="15" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#D97706" text-anchor="middle">6</text>
    <text x="22" y="155" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#1F2937" text-anchor="middle">⭐</text>
  </g>

  <!-- Column 3: Leaves (3) -->
  <g filter="url(#shadow9)" transform="translate(270, 65)">
    <rect x="0" y="20" width="45" height="80" rx="8" fill="#10B981"/>
    <text x="22" y="15" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="16" fill="#059669" text-anchor="middle">3</text>
    <text x="22" y="115" font-family="'Baloo 2', sans-serif" font-weight="900" font-size="12" fill="#1F2937" text-anchor="middle">🍃</text>
  </g>

  <line x1="40" y1="165" x2="360" y2="165" stroke="#94A3B8" stroke-width="2"/>
</svg>
